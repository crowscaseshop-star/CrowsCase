<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เกี่ยวกับเรา & ติดต่อ — Crow's Case</title>
<meta name="description" content="เรื่องราวก่อนจะมาเป็น Crow's Case และช่องทางติดต่อร้าน — LINE, Facebook, โทรศัพท์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>
<body data-page="about">

<div class="site-bg sub" aria-hidden="true"></div>

<nav class="shop-nav">
  <span class="brand-logo" data-logo></span>
  <div>
    <div class="brand-name" data-shopname>Crow's Case</div>
    <div class="brand-sub" data-tagline>PREMIUM CARD PROTECTION</div>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="order.html" data-nav="home" data-t="navHome">หน้าแรก</a>
    <a class="nav-link" href="shop.html" data-nav="shop" data-t="navShop">เลือกซื้อ</a>
    <a class="nav-link" href="about.html" data-nav="about" data-t="navAbout">เกี่ยวกับ</a>
    <a class="nav-link" href="about.html#contact" data-nav="contact" data-t="navContact">ติดต่อ</a>
  </div>
  <div class="lang-switch" id="langSwitch" role="group" aria-label="เปลี่ยนภาษา / Language"></div>
</nav>

<div class="shop-wrap">
  <!-- ===== เกี่ยวกับ ===== -->
  <header class="page-head" id="about">
    <div class="sec-kicker" data-t="aboutKicker">About Us</div>
    <h1 id="aboutTitle"></h1>
    <div class="sec-line"></div>
  </header>

  <section class="section" style="border-top:none;padding-top:8px">
    <div class="about-grid">
      <div class="about-logo"><span data-logo="about-logo-img" style="display:block;width:100%"></span></div>
      <div class="about-text">
        <div class="about-est" id="aboutEst"></div>
        <div id="aboutBody"></div>
      </div>
    </div>
    <div class="grid g-3" id="aboutPoints"></div>
  </section>

  <!-- ===== ติดต่อ ===== -->
  <section class="section" id="contact">
    <div class="sec-head">
      <div class="sec-kicker" data-t="contactKicker">Contact</div>
      <h2 data-t="contactTitle">ติดต่อเรา</h2>
      <p data-t="contactDesc"></p>
      <div class="sec-line"></div>
    </div>
    <div class="contact-grid" id="contactCards"></div>
    <div class="info-row" id="contactInfo"></div>
  </section>
</div>

<footer class="site-foot">
  <div class="logo-mini" data-logo></div>
  <div><b data-shopname style="color:var(--gold-lt)">Crow's Case</b> — <span data-tagline></span></div>
  <div id="footInfo" style="margin-top:6px"></div>
  <div id="footNote" style="margin-top:4px"></div>
</footer>

<button class="float-cart" id="fab" style="display:none">🛍 <span id="fabLabel"></span> <span class="n" id="fabN">0</span></button>
<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
