<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Crow's Case">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e1a1"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6f22"/>
    </linearGradient>
    <linearGradient id="gb" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="55%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
  </defs>

  <!-- การ์ดที่ซ้อนอยู่ด้านหลัง -->
  <g fill="none" stroke="url(#g)" stroke-width="2.4" opacity=".55">
    <rect x="72" y="24" width="70" height="18" rx="7"/>
    <rect x="69" y="31" width="76" height="18" rx="7"/>
  </g>

  <!-- ตัวเคส -->
  <path d="M62 46h90a7 7 0 0 1 7 7v106a7 7 0 0 1-7 7H62a7 7 0 0 1-7-7V53a7 7 0 0 1 7-7z"
        fill="url(#gb)" stroke="url(#g)" stroke-width="3"/>
  <!-- รอยบากด้านบนของเคส -->
  <path d="M84 46l7 11h32l7-11" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>

  <!-- ตัวอีกา -->
  <path d="M104 66c-14 0-25 9-27 22l-25 8 25 9c2 15 12 27 27 33 22 9 42 18 62 29-19-16-36-31-47-48-6-10-9-33-15-53z"
        fill="url(#gb)" stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ปีก -->
  <path d="M107 96c16 8 32 22 54 44-22-8-42-18-56-28z" fill="url(#g)" opacity=".9"/>
  <path d="M101 112c14 9 28 20 44 35-18-6-33-14-45-23z" fill="url(#g)" opacity=".55"/>
  <!-- ตา -->
  <circle cx="90" cy="86" r="3.2" fill="url(#g)"/>
</svg>
