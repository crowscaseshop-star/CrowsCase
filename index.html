<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crow's Case • ระบบจัดการการขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>
<body>

<!-- ============ หน้าเข้าสู่ระบบ ============ -->
<div class="login-wrap" id="login" style="display:none">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-logo" data-logo></div>
    <h1 data-shopname>Crow's Case</h1>
    <div class="sub" data-tagline>PREMIUM COLLECTION</div>
    <form id="loginForm">
      <div class="field">
        <label>ชื่อผู้ใช้</label>
        <input class="input" id="lgUser" autocomplete="username" placeholder="admin" required>
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input class="input" id="lgPass" type="password" autocomplete="current-password" placeholder="••••" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit" style="margin-top:8px">เข้าสู่ระบบ</button>
    </form>
    <div class="hint-box">
      บัญชีตัวอย่างสำหรับทดลองใช้<br>
      <b style="color:var(--gold-lt)">admin / 1234</b> (เจ้าของร้าน — เห็นทุกเมนู)<br>
      <b style="color:var(--gold-lt)">manager / 1234</b> (ผู้จัดการ) &nbsp;•&nbsp;
      <b style="color:var(--gold-lt)">staff / 1234</b> (พนักงานขาย)
    </div>
    <div style="text-align:center;margin-top:16px">
      <a href="order.html" style="font-size:13px">→ ไปหน้าสั่งซื้อสำหรับลูกค้า</a>
    </div>
  </div>
</div>

<!-- ============ แอปหลัง ============ -->
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" data-logo></div>
      <div style="min-width:0">
        <div class="brand-name" data-shopname>Crow's Case</div>
        <div class="brand-sub">MANAGEMENT</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user-chip">
        <span class="avatar" id="meAvatar">A</span>
        <div style="min-width:0;flex:1">
          <div class="nm" id="meName">—</div>
          <div class="rl" id="meRole">—</div>
        </div>
        <button class="btn btn-sm btn-ghost" id="btnLogout" title="ออกจากระบบ">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-toggle" id="menuToggle">☰</button>
      <div>
        <h2 id="pageTitle">ภาพรวม</h2>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <div class="top-actions">
        <span class="clock" id="clock"></span>
        <button class="btn btn-sm" id="btnShop">🛍 หน้าร้านออนไลน์</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/views-sales.js"></script>
<script src="assets/js/views-manage.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
